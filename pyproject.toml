[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "3.0.0"
description = "Autonomous Software Factory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "google-generativeai>=0.8.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: Pyflakes & pycodestyle, I: isort, UP: pyupgrade, N: pep8-naming, B: flake8-bugbear
select = ["E", "F", "I", "UP", "N", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
