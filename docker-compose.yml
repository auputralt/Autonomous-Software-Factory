version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - build_artifacts:/tmp/forge_builds

  worker:
    build: .
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: celery -A forge.queue.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      - redis
    volumes:
      - build_artifacts:/tmp/forge_builds

volumes:
  build_artifacts:
